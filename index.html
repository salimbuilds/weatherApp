<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-app</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class=" min-h-screen  flex items-center  flex-col p-4 gap-6 bg-gradient-to-b from-sky-100 to-sky-300 ">
    <h1 class="text-3xl font-bold mt-6">Weather</h1>

    <div class="mx-auto relative w-full max-w-sm">
    
<form class="max-w-md mx-auto " id="searchForm">   
    <label for="search" class="block mb-2.5 text-sm font-medium text-heading sr-only ">Search</label>
    <div class="relative">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
        </div>
        <input type="search" id="search" class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body" placeholder="Search city..." required />
        <button id="searchBtn" type="submit" class="absolute end-1.5 bottom-1.5 text-white bg-brand hover:bg-brand-strong box-border border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded text-xs px-3 py-1.5 focus:outline-none">Search</button>
    </div>
</form>
</div>
<div id="loadBox" class="w-full max-w-sm text-center"></div>
<div id="resultBox" class="w-full max-w-sm"></div>
  </body>
</html>
